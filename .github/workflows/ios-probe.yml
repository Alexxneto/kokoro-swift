name: iOS build probe

# Verifies the `Kokoro` library target actually builds for iOS after the
# platform-declaration fix in Package.swift (upstream only declared macOS).
# Not a functional test — MLX/Metal can't run on the Simulator's GPU translation
# layer, so this only proves the code compiles, not that synthesis works.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Packages/**'
      - '.github/workflows/ios-probe.yml'

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -scheme Kokoro

      - name: Build Kokoro for iOS (simulator destination, no code signing)
        run: |
          xcodebuild build \
            -scheme Kokoro \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
